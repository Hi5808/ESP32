<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="monospace" font-size="13">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="20" y="24" font-size="16" font-weight="bold" fill="#111">Bruce fork - wiring (ESP32-S3-DevKitC-1 N16R8)</text>

  <!-- ESP32-S3 board -->
  <rect x="40" y="50" width="260" height="470" rx="6" fill="#eef4ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="170" y="72" text-anchor="middle" font-weight="bold" fill="#1d4ed8">ESP32-S3-DevKitC-1 N16R8</text>
  <text x="50" y="410" fill="#555">3V3 -> nRF24, CC1101, OLED VCC</text>
  <text x="50" y="428" fill="#555">GND -> nRF24, CC1101, OLED GND</text>
  <text x="50" y="454" fill="#555">Avoid: 0/3/45/46 strapping,</text>
  <text x="50" y="470" fill="#555">26-37 PSRAM/flash, 48 RGB LED</text>

  <!-- ESP32 GPIO labels (right edge x=300) -->
  <g fill="#111">
    <text x="236" y="84" text-anchor="end">GPIO12 SCK</text>
    <text x="236" y="112" text-anchor="end">GPIO11 MOSI</text>
    <text x="236" y="140" text-anchor="end">GPIO13 MISO</text>
    <text x="236" y="168" text-anchor="end">GPIO15 CS_CC</text>
    <text x="236" y="196" text-anchor="end">GPIO4 GDO0</text>
    <text x="236" y="252" text-anchor="end">GPIO10 CS_NRF</text>
    <text x="236" y="280" text-anchor="end">GPIO9 CE</text>
    <text x="236" y="336" text-anchor="end">GPIO8 SDA</text>
    <text x="236" y="364" text-anchor="end">GPIO7 SCL</text>
  </g>
  <g fill="#1d4ed8">
    <circle cx="300" cy="80" r="4"/><circle cx="300" cy="108" r="4"/><circle cx="300" cy="136" r="4"/>
    <circle cx="300" cy="164" r="4"/><circle cx="300" cy="192" r="4"/>
    <circle cx="300" cy="248" r="4"/><circle cx="300" cy="276" r="4"/>
    <circle cx="300" cy="332" r="4"/><circle cx="300" cy="360" r="4"/>
  </g>

  <!-- Shared SPI bus (SCK / MOSI / MISO) to both radios -->
  <g stroke="#7c3aed" stroke-width="2" fill="none">
    <path d="M300 80 L600 90"/>
    <path d="M300 80 L600 296"/>
    <path d="M300 108 L600 118"/>
    <path d="M300 108 L600 320"/>
    <path d="M300 136 L600 146"/>
    <path d="M300 136 L600 344"/>
  </g>
  <!-- Radio control lines -->
  <g stroke="#dc2626" stroke-width="2" fill="none">
    <path d="M300 164 L600 174"/>
    <path d="M300 192 L600 202"/>
    <path d="M300 248 L600 368"/>
    <path d="M300 276 L600 392"/>
  </g>
  <!-- I2C to OLED -->
  <g stroke="#059669" stroke-width="2" fill="none">
    <path d="M300 332 L600 485"/>
    <path d="M300 360 L600 505"/>
  </g>

  <!-- CC1101 module -->
  <rect x="600" y="60" width="260" height="190" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="82" text-anchor="middle" font-weight="bold" fill="#7c3aed">CC1101 (sub-GHz)</text>
  <g fill="#111">
    <text x="612" y="95">SCK</text>
    <text x="612" y="123">MOSI</text>
    <text x="612" y="151">MISO</text>
    <text x="612" y="179">CSN</text>
    <text x="612" y="207">GDO0</text>
    <text x="612" y="235">GDO2 (not wired)</text>
  </g>

  <!-- nRF24L01 module -->
  <rect x="600" y="270" width="260" height="170" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="730" y="292" text-anchor="middle" font-weight="bold" fill="#7c3aed">nRF24L01 (2.4 GHz)</text>
  <g fill="#111">
    <text x="612" y="300">SCK</text>
    <text x="612" y="324">MOSI</text>
    <text x="612" y="348">MISO</text>
    <text x="612" y="372">CSN</text>
    <text x="612" y="396">CE</text>
    <text x="612" y="420">IRQ (not wired)</text>
  </g>

  <!-- OLED module -->
  <rect x="600" y="460" width="260" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="730" y="480" text-anchor="middle" font-weight="bold" fill="#059669">1.3" I2C OLED</text>
  <g fill="#111">
    <text x="612" y="503">SDA</text>
    <text x="612" y="523">SCL</text>
  </g>

  <!-- Module pin dots -->
  <g fill="#111">
    <circle cx="600" cy="90" r="3"/><circle cx="600" cy="118" r="3"/><circle cx="600" cy="146" r="3"/>
    <circle cx="600" cy="174" r="3"/><circle cx="600" cy="202" r="3"/>
    <circle cx="600" cy="296" r="3"/><circle cx="600" cy="320" r="3"/><circle cx="600" cy="344" r="3"/>
    <circle cx="600" cy="368" r="3"/><circle cx="600" cy="392" r="3"/>
    <circle cx="600" cy="485" r="3"/><circle cx="600" cy="505" r="3"/>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <rect x="40" y="530" width="14" height="4" fill="#7c3aed"/><text x="60" y="538" fill="#111">shared SPI bus</text>
    <rect x="200" y="530" width="14" height="4" fill="#dc2626"/><text x="220" y="538" fill="#111">radio control</text>
    <rect x="340" y="530" width="14" height="4" fill="#059669"/><text x="360" y="538" fill="#111">I2C</text>
  </g>
</svg>
