; My build: ESP32-S3-DevKitC-1 N16R8 + CC1101 + nRF24L01 + 1.3" I2C OLED
; Pin map from MY_BUILD.md. Overrides the ESP-General defaults with -U then -D.
; OLED (SH1106, 128x64, I2C) is driven through the LovyanGFX backend.

[env:my-s3-n16r8]
extends = env:esp32-s3-devkitc-1-psram
lib_deps =
	${env.lib_deps}
	; develop commit, as the display README recommends for Arduino 3.3 on ESP32-S3
	https://github.com/lovyan03/LovyanGFX#11cf6a2ca8f7de40a6f941b5242ed3510a526982
build_flags =
	${env:esp32-s3-devkitc-1-psram.build_flags}
	; Display: LovyanGFX, SH1106 over I2C
	-DHAS_SCREEN=1
	-DUSE_LOVYANGFX=1
	-DLOVYAN_PANEL=Panel_SH1106
	-DLOVYAN_BUS=Bus_I2C
	-DLOVYAN_I2C_BUS=1
	-DTFT_I2C_PORT=0
	-DTFT_I2C_WRITE=400000
	-DTFT_I2C_READ=400000
	-DTFT_SDA=8
	-DTFT_SCL=7
	-DTFT_ADDR=0x3C
	-DTFT_BUSY_PIN=-1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=64
	-DTFT_OFFSET_X=0
	-DTFT_OFFSET_Y=0
	-DTFT_INVERTION=0
	-DTFT_RGB_ORDER=0
	-DTFT_MEM_WIDTH=128
	-DTFT_MEM_HEIGHT=64
	; I2C bus (OLED): SDA 8, SCL 7
	-UGROVE_SDA
	-DGROVE_SDA=8
	-UGROVE_SCL
	-DGROVE_SCL=7
	; Shared SPI bus: SCK 12, MOSI 11, MISO 13
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	; CC1101: CSN 15, GDO0 4 (GDO2 not wired)
	-UCC1101_SS_PIN
	-UCC1101_GDO0_PIN
	-UCC1101_MOSI_PIN
	-UCC1101_SCK_PIN
	-UCC1101_MISO_PIN
	-DCC1101_SS_PIN=15
	-DCC1101_GDO0_PIN=4
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	-DUSE_CC1101_VIA_SPI
	; nRF24L01: CSN 10, CE 9 (IRQ not wired)
	-UNRF24_SS_PIN
	-UNRF24_CE_PIN
	-UNRF24_MOSI_PIN
	-UNRF24_SCK_PIN
	-UNRF24_MISO_PIN
	-DNRF24_SS_PIN=10
	-DNRF24_CE_PIN=9
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	-DUSE_NRF24_VIA_SPI
