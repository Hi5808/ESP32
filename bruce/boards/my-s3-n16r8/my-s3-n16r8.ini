; My build: ESP32-S3-DevKitC-1 N16R8 + CC1101 + nRF24L01 + 1.3" I2C OLED
; Pin map from MY_BUILD.md. Overrides the ESP-General defaults with -U then -D.
; The OLED display driver is not implemented yet (see MY_BUILD.md).

[env:my-s3-n16r8]
extends = env:esp32-s3-devkitc-1-psram
build_flags =
	${env:esp32-s3-devkitc-1-psram.build_flags}
	; I2C bus (OLED): SDA 8, SCL 7
	-UGROVE_SDA
	-DGROVE_SDA=8
	-UGROVE_SCL
	-DGROVE_SCL=7
	; Shared SPI bus: SCK 12, MOSI 11, MISO 13
	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=10
	; CC1101: CSN 15, GDO0 4 (GDO2 not wired)
	-UCC1101_SS_PIN
	-UCC1101_GDO0_PIN
	-UCC1101_MOSI_PIN
	-UCC1101_SCK_PIN
	-UCC1101_MISO_PIN
	-DCC1101_SS_PIN=15
	-DCC1101_GDO0_PIN=4
	-DCC1101_MOSI_PIN=11
	-DCC1101_SCK_PIN=12
	-DCC1101_MISO_PIN=13
	-DUSE_CC1101_VIA_SPI
	; nRF24L01: CSN 10, CE 9 (IRQ not wired)
	-UNRF24_SS_PIN
	-UNRF24_CE_PIN
	-UNRF24_MOSI_PIN
	-UNRF24_SCK_PIN
	-UNRF24_MISO_PIN
	-DNRF24_SS_PIN=10
	-DNRF24_CE_PIN=9
	-DNRF24_MOSI_PIN=11
	-DNRF24_SCK_PIN=12
	-DNRF24_MISO_PIN=13
	-DUSE_NRF24_VIA_SPI
